<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="presentation">
  <!--
    純色塊佔位圖(1200×630 = 1.91:1,同時是 Open Graph 標準尺寸)。
    這是 public/ 底下的資產不是 CSS,所以色值直接寫死;但每一個都逐字取自
    site/src/styles/variables.css 既有 token 的 hex fallback 值,沒有另創顏色:
      #e7f2f2 = token color-primary-soft
      #194545 = token color-primary
      #082a2b = token color-primary-deep
      #c0dada = token color-primary-line
      #c34b30 = token color-accent
    (token 在 variables.css 裡帶兩個前置連字號;XML 註解不得含連續兩個連字號,故此處省略。)
    刻意不放文字:真圖(同尺寸 .png)換檔名即可替換,版面不必改(見 src/lib/data.mjs 的 coverPath)。
  -->
  <rect width="1200" height="630" fill="#e7f2f2"/>
  <rect x="0" y="392" width="1200" height="238" fill="#194545"/>
  <rect x="120" y="80" width="360" height="360" fill="#c34b30"/>
  <rect x="540" y="160" width="240" height="280" fill="#c0dada"/>
  <rect x="840" y="40" width="240" height="400" fill="#082a2b"/>
</svg>
