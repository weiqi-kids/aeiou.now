# aeiou.now — 七語系靜態站 build & deploy(Track E / W5)
#
# 三個必守事實(踩過的坑,不要改掉):
#  1. publish repo 走 GitHub Pages deploy-from-branch = Jekyll 管線,`_astro/` 這種
#     底線開頭目錄會被丟棄 → 每次推送都必須寫入 `.nojekyll`(見 Deploy step)。
#  2. deploy key 是 SSH 機制,HTTPS remote 一律失敗 → remote 用
#     git@github.com:weiqi-kids/aeiou-pages-<x>.git,配 GIT_SSH_COMMAND + known_hosts。
#  3. Pages 部署在 publish repo 非同步發生,push 完立刻 curl 必 404 → 必須輪詢。
#  4. test job 是七站部署的前置關卡(needs: test)。測試紅了就不該有任何一站上線。
#     且不得用 `gh api repos/<publish>/pages/builds` 輪詢(CI 的 GITHUB_TOKEN
#     對他 repo 無權限,必 403),只能打站台 URL 本身。
#
# IndexNow:2026-08-19 用戶指示提前實作,由本檔最後的 indexnow job 在七站全部部署完之後
#   呼叫 scripts/indexnow.mjs(best-effort,continue-on-error,不擋任何東西)。
#   Google 不吃 IndexNow,它走 sitemap 的 lastmod —— 兩條路互補。
# 仍未做:GSC 提交 job(sitemap 已在 GSC 手動提交過,不需要 job)。
#
# 2026-08-15 起七站掛自訂網域:每站 BASE_PATH=/、SITE_URL=自己的網域,dist 必帶 CNAME
# (deploy-from-branch 推送若少了 CNAME,GitHub 會直接解除網域綁定)。

name: build

on:
  schedule:
    # 刻意錯開整點:主機 cron 在整點 push,錯開避免互踩。
    - cron: '17 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLIC_API_URL: https://aeiou-api.lightman-chang.workers.dev
  # GA4 量測 ID:七站共用一個 web stream,報表以 hostname 區分(介面常數,見 CLAUDE.md)
  PUBLIC_GA4_ID: G-ZMTFG68ZJ5

jobs:
  # 測試先跑一次,綠了才准部署 —— 七個語系的 deploy 全部 needs: test。
  # 為什麼要擋在部署前:Worker 是唯一直接面對外部寫入的碼(限流、發文閘門、
  # 內部端點認證),2026-08-19 發文閘門被改壞、把所有 archived Topic 鎖死不能發文,
  # 上線後沒有任何自動化擋下來。tests/api/ 就是為了讓那件事不能再發生。
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 零 npm 依賴:測試只用 node 內建(node:test / node:sqlite),不必 install。
      - name: Run tests
        run: node --test 'tests/**/*.test.mjs'

      # 內容厚度守門(2026-08-19 加):國別變體、唯一內容量、逐國來源歸屬、排行榜空頁。
      # 主機端 hourly-export 也會跑同一支;放在 CI 是為了擋「直接改 data/ 推上來」的路徑。
      - name: 內容厚度守門
        run: node scripts/check-content-depth.mjs

      # 來源存活檢查(2026-08-19 加):頁面上印出來的 source 連結有沒有 404。
      # 🔴 刻意不進主機每小時管線——那會把別人的網站狀態綁進本站的資料匯出。
      #    這裡也只擋 404/410;403/412/5xx 是對方擋機器人或暫時故障,只警告。
      #    continue-on-error:false 是刻意的——真的 404 就該擋下部署,那是印在頁面上的死連結。
      - name: 來源連結存活檢查
        run: node scripts/check-source-urls.mjs

  build-deploy:
    name: ${{ matrix.locale }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # cname/site_url 映射=CLAUDE.md 介面常數(ja→jp、zh-CN→cn、pt-BR→br 不同名)
        include:
          - locale: zh-TW
            repo: weiqi-kids/aeiou-pages-zh-tw
            secret_suffix: ZH_TW
            cname: aeiou.now
          - locale: en
            repo: weiqi-kids/aeiou-pages-en
            secret_suffix: EN
            cname: en.aeiou.now
          - locale: ja
            repo: weiqi-kids/aeiou-pages-ja
            secret_suffix: JA
            cname: jp.aeiou.now
          - locale: zh-CN
            repo: weiqi-kids/aeiou-pages-zh-cn
            secret_suffix: ZH_CN
            cname: cn.aeiou.now
          - locale: hi
            repo: weiqi-kids/aeiou-pages-hi
            secret_suffix: HI
            cname: hi.aeiou.now
          - locale: id
            repo: weiqi-kids/aeiou-pages-id
            secret_suffix: ID
            cname: id.aeiou.now
          - locale: pt-BR
            repo: weiqi-kids/aeiou-pages-pt-br
            secret_suffix: PT_BR
            cname: br.aeiou.now

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install deps
        working-directory: site
        run: pnpm install --frozen-lockfile

      # build 鏈完全等同 site/package.json 的 `build`
      # (copy-data → check-design → check-content → astro build),
      # CI 不另寫一條。cwd 必須是 site/(check-design.mjs 寫死掃相對 cwd 的 src/)。
      - name: Build
        working-directory: site
        env:
          LOCALE: ${{ matrix.locale }}
          BASE_PATH: /
          SITE_URL: https://${{ matrix.cname }}
          PUBLIC_API_URL: ${{ env.PUBLIC_API_URL }}
          PUBLIC_GA4_ID: ${{ env.PUBLIC_GA4_ID }}
        run: pnpm build

      - name: Setup deploy key (SSH)
        env:
          DEPLOY_KEY: ${{ secrets[format('DEPLOY_KEY_{0}', matrix.secret_suffix)] }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::secret DEPLOY_KEY_${{ matrix.secret_suffix }} 不存在或為空"
            exit 1
          fi
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Deploy to publish repo
        id: deploy
        env:
          GIT_SSH_COMMAND: ssh -i /home/runner/.ssh/deploy_key -o IdentitiesOnly=yes -o UserKnownHostsFile=/home/runner/.ssh/known_hosts -o StrictHostKeyChecking=yes
        run: |
          set -euo pipefail
          PUB_DIR="$RUNNER_TEMP/publish"

          # 網路動作一律重試(2026-08-21 新增)。當天實測:同一次推送裡
          # `ssh: connect to host github.com port 22: Connection refused` 連中兩次,
          # 七個語系是七個獨立 job、不是原子的,於是站台停在「六站新版、主站舊版」——
          # 不同語系跑不同的碼,比乾脆整輪失敗更糟。
          # clone 與 push 都是冪等的(publish repo 只有這個 job 會寫),重試沒有副作用。
          # ⚠ 變數一律帶 _retry_ 前綴:bash 的 local 是**動態作用域**,被 retry 呼叫的函式
          #    會看到這裡的區域變數。用 n / max 這種通用名,日後誰寫一個也用 n 的函式
          #    就會互相踩(2026-08-21 寫這段時實測踩到)。
          retry() {
            local _retry_label="$1" _retry_max="$2"; shift 2
            local _retry_n=1 _retry_wait
            until "$@"; do
              if [ "$_retry_n" -ge "$_retry_max" ]; then
                echo "✗ ${_retry_label} 連續 ${_retry_max} 次失敗" >&2
                return 1
              fi
              _retry_wait=$(( _retry_n * 10 ))
              echo "⚠ ${_retry_label} 第 ${_retry_n}/${_retry_max} 次失敗,${_retry_wait}s 後重試" >&2
              sleep "$_retry_wait"
              _retry_n=$(( _retry_n + 1 ))
            done
          }
          clone_publish() {
            # 失敗會留下半套目錄,每次重試都要先清掉
            rm -rf "$PUB_DIR"
            # SSH remote(deploy key 是 SSH 機制,HTTPS 走不通)
            git clone --depth 1 "git@github.com:${{ matrix.repo }}.git" "$PUB_DIR"
          }
          retry "clone ${{ matrix.repo }}" 3 clone_publish

          git -C "$PUB_DIR" config user.name  "aeiou-ci"
          git -C "$PUB_DIR" config user.email "lightman.chang@gmail.com"

          # 清空舊內容(保留 .git),再鋪上新 dist/
          find "$PUB_DIR" -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a site/dist/. "$PUB_DIR"/

          # Jekyll 會丟掉 _astro/,.nojekyll 不是選配
          touch "$PUB_DIR/.nojekyll"

          # 自訂網域綁定靠這個檔:deploy-from-branch 推送少了 CNAME = 解除綁定
          printf '%s\n' "${{ matrix.cname }}" > "$PUB_DIR/CNAME"

          # 先判斷 dist 有沒有實質變更。指紋檔 .build-id 每次 commit 都不同,
          # 若在此之前就寫下去,「無變更則 skip」會永遠失效、每輪都推。
          git -C "$PUB_DIR" add -A
          if git -C "$PUB_DIR" diff --cached --quiet; then
            echo "dist 無變更,skip push(${{ matrix.repo }})"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            # 部署指紋:verify 用它判斷「線上真的換成這一版了」。
            # 沒有它的話,GitHub Pages 還在服務舊版時同樣回 200,verify 會假綠
            # (2026-08-11 實測:CI 綠燈後 zh-tw 仍送舊首頁約 80 秒)。
            echo "${GITHUB_SHA}" > "$PUB_DIR/.build-id"
            git -C "$PUB_DIR" add .build-id
            # dist 內容可能只在工作樹清理階段看起來不同；重新 add build-id
            # 後若 index 仍無差異，必須把排程視為成功的 no-op，不能讓 git commit
            # 的 exit 1 把七個語系整輪染紅。
            if git -C "$PUB_DIR" diff --cached --quiet; then
              echo "dist 無變更,skip push(${{ matrix.repo }})"
              echo "pushed=false" >> "$GITHUB_OUTPUT"
            else
              git -C "$PUB_DIR" commit -m "deploy ${{ matrix.locale }} @ ${GITHUB_SHA::7}"
              retry "push ${{ matrix.repo }}" 3 git -C "$PUB_DIR" push origin HEAD:main
              echo "pushed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # W5.3 verify:只打站台 URL 本身,絕不打他 repo 的 Pages API(必 403)。
      # 間隔 15s、上限 5 分鐘(20 次)。
      - name: Verify homepage + _astro asset
        id: verify
        run: |
          set -uo pipefail
          BASE="https://${{ matrix.cname }}"
          HOME_URL="$BASE/"

          # 從本次 build 的 dist/ 取一個實際 _astro 資產(hash 檔名 = 新版真的上線的證據)
          ASSET_FILE="$(ls site/dist/_astro 2>/dev/null | head -n 1 || true)"
          if [ -z "$ASSET_FILE" ]; then
            echo "::error::site/dist/_astro 沒有任何資產,build 結果不對"
            exit 1
          fi
          ASSET_URL="$BASE/_astro/$ASSET_FILE"
          echo "homepage: $HOME_URL"
          echo "asset:    $ASSET_URL"

          # -k + http fallback:自訂網域首次綁定後 GitHub 簽憑證要幾分鐘,
          # 過渡期 HTTPS 會憑證不符或握手失敗;內容真偽由 .build-id 比對把關,
          # 這裡的 TLS 寬容只影響「拿不拿得到內容」。
          fetch_code() {
            local url="$1" code
            code="$(curl -ks -o /dev/null -w '%{http_code}' -L --max-time 20 "$url" || echo 000)"
            if [ "$code" = "000" ]; then
              code="$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "${url/https:/http:}" || echo 000)"
            fi
            echo "$code"
          }

          poll() {
            local url="$1" label="$2" code=""
            for i in $(seq 1 20); do   # 20 × 15s = 5 分鐘上限
              code="$(fetch_code "$url")"
              echo "  [$label] attempt $i/20 -> HTTP $code"
              if [ "$code" = "200" ]; then
                return 0
              fi
              sleep 15
            done
            echo "::error::[$label] $url 在 5 分鐘內未回 200(最後 HTTP $code)"
            return 1
          }

          # 輪詢 .build-id 直到它等於本次 commit —— 這才是「新版真的上線」的證據。
          # 只驗 200 不夠:舊部署同樣回 200;_astro 資產只在 CSS/JS 內容有變(檔名 hash 換掉)
          # 時才擋得住,純文字或結構改動時檔名不變,舊版照樣 200 → 假綠。
          # 輪詢預算 2026-08-20 從 5 分鐘拉到 10 分鐘。緣由:610b87d 那輪 zh-TW 與 zh-CN
          # 兩個 job 在 5 分鐘內沒等到 .build-id 更新而報 failure,但事後查證七站**都已經**
          # 是該版、內容也正確 —— GitHub Pages 那次發布單純比較慢。
          # 這是「假紅」,和這道 gate 當初要防的「假綠」是同一枚硬幣的兩面:假綠讓人以為上線了,
          # 假紅讓人開始不看紅燈。兩者都會讓這道 gate 失去意義,所以寧可多等 5 分鐘。
          BUILD_ID_TRIES=40   # 40 × 15s = 10 分鐘上限
          poll_build_id() {
            local url="$BASE/.build-id" got=""
            for i in $(seq 1 "$BUILD_ID_TRIES"); do
              got="$(curl -ks -L --max-time 20 "$url" | tr -d '[:space:]' || true)"
              if [ -z "$got" ]; then
                got="$(curl -s -L --max-time 20 "${url/https:/http:}" | tr -d '[:space:]' || true)"
              fi
              if [ "$got" = "$GITHUB_SHA" ]; then
                echo "  [build-id] attempt $i/$BUILD_ID_TRIES -> 命中 ${GITHUB_SHA::7}"
                return 0
              fi
              echo "  [build-id] attempt $i/$BUILD_ID_TRIES -> 線上為 '${got:0:7}',等待 ${GITHUB_SHA::7}"
              sleep 15
            done
            echo "::error::[build-id] $url 在 10 分鐘內未更新為 ${GITHUB_SHA::7}(最後為 '${got:0:7}')"
            return 1
          }

          poll "$HOME_URL" homepage || exit 1
          poll "$ASSET_URL" _astro   || exit 1

          # 只有這輪真的推了新內容才驗指紋。skip 的情況下線上本來就是對的,
          # 而 .build-id 仍是上一次的 SHA,驗它只會誤報。
          if [ "${{ steps.deploy.outputs.pushed }}" = "true" ]; then
            poll_build_id || exit 1
            echo "verify OK: ${{ matrix.locale }}(內容已確認為本次 build)"
          else
            echo "verify OK: ${{ matrix.locale }}(dist 無變更,線上維持上一版)"
          fi

      # Slack 告警:secret 未設時 gracefully skip,不讓整條紅掉。
      # bot-token 式(chat.postMessage),與其他站台 deploy.yml 慣例一致;
      # 需 repo secrets:SLACK_BOT_TOKEN + SLACK_CHANNEL_ID(頻道建好後設定)。
      - name: Slack alert on failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          set -uo pipefail
          if [ -z "${SLACK_BOT_TOKEN:-}" ] || [ -z "${SLACK_CHANNEL_ID:-}" ]; then
            echo "SLACK_BOT_TOKEN/SLACK_CHANNEL_ID 未設定,跳過 Slack 告警(不視為失敗)。"
            exit 0
          fi
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          TEXT="aeiou.now build 失敗:locale=${{ matrix.locale }} repo=${{ matrix.repo }}\n${RUN_URL}"
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$(printf '{"channel":"%s","text":"%s"}' "$SLACK_CHANNEL_ID" "$TEXT")" \
            || echo "Slack 送出失敗(忽略,不影響 job 結果)"

  # 七站全部部署完才送 —— IndexNow 會去抓你送的 URL,提早送等於送 404。
  # best-effort:continue-on-error,失敗不影響任何已完成的部署。
  indexnow:
    name: indexnow
    needs: build-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit changed URLs to IndexNow
        run: node scripts/indexnow.mjs
        continue-on-error: true
